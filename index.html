<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta Anuar</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f4f4;color:#151515}
.container{max-width:1000px;margin:auto;padding:18px}
.header{background:#111;color:#fff;border-radius:14px;padding:22px;margin-bottom:14px}
.header small{opacity:.75}.header h1{margin:6px 0 4px;font-size:28px}.header p{margin:0;opacity:.8}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;border:1px solid #ccc;background:#fff;padding:13px;border-radius:10px;font-weight:700}
.tab.active{background:#111;color:#fff}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,select,button{font:inherit}
input,select{width:100%;padding:13px;border:1px solid #ccc;border-radius:9px;background:#fff}
.searchrow{display:grid;grid-template-columns:1fr auto;gap:8px}
button{border:0;border-radius:9px;padding:13px 16px;font-weight:700;cursor:pointer}
.primary{background:#111;color:#fff}.secondary{background:#eee;color:#111}.green{background:#16853a;color:#fff}
.results{margin-top:12px}
.product{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid #e2e2e2;border-radius:10px;padding:12px;margin:8px 0}
.product h3{font-size:15px;margin:0 0 5px}.meta{font-size:12px;color:#666}.prices{font-size:13px;margin-top:5px}.price{font-weight:800}
.product button{padding:9px 12px}
.order-row{display:grid;grid-template-columns:1fr 70px 100px 34px;gap:7px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}
.order-row:last-child{border-bottom:0}
.qty{padding:9px;text-align:center}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;border-top:2px solid #111;padding-top:12px;margin-top:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.hidden{display:none}
.empty{text-align:center;color:#777;padding:18px}
.badge{display:inline-block;background:#eee;border-radius:20px;padding:4px 8px;font-size:11px;margin-top:4px}
@media(max-width:650px){
 .searchrow{grid-template-columns:1fr}
 .product{grid-template-columns:1fr}
 .product button{width:100%}
 .order-row{grid-template-columns:1fr 55px 85px 34px}
 .actions{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <small>ANUAR COSMÉTICOS</small>
    <h1>Consulta Anuar</h1>
    <p>Consulte produtos, monte o pedido e gere o faturamento para o cliente.</p>
  </div>

  <div class="tabs">
    <button id="tabDist" class="tab active" onclick="setTable('dist')">Distribuidor</button>
    <button id="tabSalon" class="tab" onclick="setTable('salon')">Salão Bahia</button>
  </div>

  <div class="card">
    <label for="search">CÓDIGO OU NOME DO PRODUTO</label>
    <div class="searchrow">
      <input id="search" placeholder="Ex.: 000012 ou Shampoo Dux" oninput="searchProducts()">
      <button class="primary" onclick="searchProducts()">Pesquisar</button>
    </div>
    <div id="results" class="results"><div class="empty">Digite o código ou nome para pesquisar.</div></div>
  </div>

  <div class="card">
    <h2 style="margin-top:0">Faturamento / Pedido</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><label for="client">CLIENTE</label><input id="client" placeholder="Nome do cliente"></div>
      <div><label for="date">DATA</label><input id="date" type="date"></div>
    </div>
    <div id="order"><div class="empty">Nenhum produto adicionado.</div></div>
    <div class="total"><span>Total</span><span id="total">R$ 0,00</span></div>
    <div class="actions">
      <button class="primary" onclick="generateInvoice()">Gerar faturamento</button>
      <button class="green" onclick="sendWhatsApp()">Enviar pelo WhatsApp</button>
    </div>
    <button class="secondary" style="width:100%;margin-top:8px" onclick="clearOrder()">Limpar pedido</button>
  </div>

  <div id="invoiceCard" class="card hidden">
    <h2 style="margin-top:0">Faturamento gerado</h2>
    <textarea id="invoiceText" style="width:100%;min-height:260px;padding:12px;border:1px solid #ccc;border-radius:9px"></textarea>
    <button class="secondary" style="width:100%;margin-top:8px" onclick="copyInvoice()">Copiar faturamento</button>
  </div>
</div>

, "size": "300g", "price": 17.6, "category": "ESPECIAL BLOND", "salonPrice": null}, {"name": "DEFRIRUM VIOLETA MAN. ESPECIAL BLOND", "code": "000948", "size": "300g", "price": 17.6, "category": "ESPECIAL BLOND", "salonPrice": null}, {"name": "MATIZADOR VERDE ESPECIAL BLOND", "code": "000037", "size": "1KG", "price": 80.4, "category": "ESPECIAL BLOND", "salonPrice": null}, {"name": "MATIZADOR VIOLETA ESPECIAL BLOND", "code": "000038", "size": "1KG", "price": 80.4, "category": "ESPECIAL BLOND", "salonPrice": null}];
let table = 'dist';
let order = [];

const brl = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
const today = new Date();
document.getElementById('date').value = today.toISOString().slice(0,10);

function priceOf(p){
  if(table==='salon') return p.salonPrice ?? p.price;
  return p.price;
}
function setTable(t){
  table=t;
  document.getElementById('tabDist').classList.toggle('active',t==='dist');
  document.getElementById('tabSalon').classList.toggle('active',t==='salon');
  searchProducts();
  renderOrder();
}
function searchProducts(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const box=document.getElementById('results');
  if(!q){box.innerHTML='<div class="empty">Digite o código ou nome para pesquisar.</div>';return;}
  const found=products.filter(p=>{
    const hay=(p.code+' '+p.name+' '+p.category+' '+p.size).toLowerCase();
    return hay.includes(q) && (table==='dist' || p.salonPrice!==null);
  }).slice(0,30);
  if(!found.length){box.innerHTML='<div class="empty">Nenhum produto encontrado.</div>';return;}
  box.innerHTML=found.map(p=>`
    <div class="product">
      <div>
        <h3>${esc(p.name)}</h3>
        <div class="meta">Código ${p.code} • ${esc(p.size)} • ${esc(p.category)}</div>
        <div class="prices">Preço: <span class="price">${brl(priceOf(p))}</span>
        ${table==='dist' && p.salonPrice!==null ? ` <span class="badge">Salão Bahia: ${brl(p.salonPrice)}</span>`:''}</div>
      </div>
      <button class="primary" onclick="addProduct('${p.code}')">Adicionar</button>
    </div>`).join('');
}
function addProduct(code){
  const p=products.find(x=>x.code===code);
  if(!p)return;
  const existing=order.find(x=>x.code===code && x.table===table);
  if(existing) existing.qty++;
  else order.push({code:p.code,name:p.name,size:p.size,qty:1,unit:priceOf(p),table});
  renderOrder();
}
function renderOrder(){
  const box=document.getElementById('order');
  if(!order.length){box.innerHTML='<div class="empty">Nenhum produto adicionado.</div>';document.getElementById('total').textContent=brl(0);return;}
  box.innerHTML=order.map((x,i)=>`
    <div class="order-row">
      <div><b>${esc(x.name)}</b><div class="meta">Código ${x.code} • ${esc(x.size)} • ${x.table==='salon'?'Salão Bahia':'Distribuidor'}</div></div>
      <input class="qty" type="number" min="1" value="${x.qty}" onchange="changeQty(${i},this.value)">
      <b>${brl(x.unit*x.qty)}</b>
      <button class="secondary" onclick="removeItem(${i})">×</button>
    </div>`).join('');
  const total=order.reduce((s,x)=>s+x.unit*x.qty,0);
  document.getElementById('total').textContent=brl(total);
}
function changeQty(i,v){order[i].qty=Math.max(1,parseInt(v)||1);renderOrder();}
function removeItem(i){order.splice(i,1);renderOrder();}
function clearOrder(){order=[];renderOrder();document.getElementById('invoiceCard').classList.add('hidden');}
function invoiceMessage(){
  const client=document.getElementById('client').value.trim()||'Cliente';
  const date=document.getElementById('date').value;
  const dateBr=date?date.split('-').reverse().join('/'):'';
  const total=order.reduce((s,x)=>s+x.unit*x.qty,0);
  let text=`ANUAR COSMÉTICOS\\nFATURAMENTO / PEDIDO\\n\\nCliente: ${client}\\nData: ${dateBr}\\n\\n`;
  order.forEach(x=>{text+=`${x.qty}x ${x.name} - ${brl(x.unit)} = ${brl(x.unit*x.qty)}\\nCódigo: ${x.code}\\n`;});
  text+=`\\nTOTAL: ${brl(total)}\\n\\nObrigado pela preferência!`;
  return text;
}
function generateInvoice(){
  if(!order.length){alert('Adicione pelo menos um produto.');return;}
  document.getElementById('invoiceText').value=invoiceMessage();
  document.getElementById('invoiceCard').classList.remove('hidden');
  document.getElementById('invoiceCard').scrollIntoView({behavior:'smooth'});
}
async function copyInvoice(){
  const text=document.getElementById('invoiceText').value;
  try{await navigator.clipboard.writeText(text);alert('Faturamento copiado!');}
  catch(e){document.getElementById('invoiceText').select();document.execCommand('copy');alert('Faturamento copiado!');}
}
function sendWhatsApp(){
  if(!order.length){alert('Adicione pelo menos um produto.');return;}
  const text=encodeURIComponent(invoiceMessage());
  window.open('https://wa.me/?text='+text,'_blank');
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
